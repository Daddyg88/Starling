# Builds a Starling release when you push a tag like v0.12.0.
#   git tag v0.12.0 && git push origin v0.12.0
# It runs the tests, builds Starling.exe (the launcher) on Windows, zips the program, and publishes all of it as a
# GitHub Release. Starling.exe on your computer then finds and installs the new version by itself.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches core/version.py
        shell: bash
        run: |
          v=$(python -c "from core.version import __version__ as v; print(v)")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; fi

      - name: Run the tests (a failure is shown but does not stop the release)
        shell: bash
        continue-on-error: true
        run: python -m unittest discover -s tests -t .

      - name: Build the program zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $items = Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','dist','build','tests','data','logs','recordings','.venv','__pycache__','launcher') }
          Compress-Archive -Path $items.FullName -DestinationPath dist/Starling-app.zip
          $hash = (Get-FileHash dist/Starling-app.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Starling-app.zip" | Out-File -Encoding ascii -NoNewline dist/Starling-app.zip.sha256

      - name: Build Starling.exe
        shell: pwsh
        run: |
          "REPO = `"${{ github.repository }}`"" | Out-File -Encoding ascii launcher/launcher_config.py
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name Starling --paths . --paths launcher launcher/launcher.py

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/Starling.exe dist/Starling-app.zip dist/Starling-app.zip.sha256"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" $files --clobber     # you already made the release by hand: add the files
          else
            gh release create "${GITHUB_REF_NAME}" $files --title "Starling ${GITHUB_REF_NAME}" --generate-notes
          fi
