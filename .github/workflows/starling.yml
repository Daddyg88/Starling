# ONE workflow for every push to main. Three jobs, in this order, so GitHub shows a single run per push:
#   1. tests    - runs all the tests (Linux). If this fails, nothing below runs and no release is made from a broken change.
#   2. website  - builds the guide website from the code and publishes it with GitHub Pages.
#   3. release  - builds Starling.exe and the program zip on Windows and publishes them as a GitHub Release
#                 (the tag v<version> is made for you from core/version.py; if that release already exists it does nothing).
# You can also push a tag like v0.12.0 by hand (git tag v0.12.0 && git push origin v0.12.0); it must match core/version.py.
# The Windows-only parts (voice, listening, the real game) are tested by people; see docs/TODO.md "Needs a real-game test".
name: Starling

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starling-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the tests need
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libportaudio2 libgl1
          python -m pip install --upgrade pip
          python -m pip install numpy pillow scipy opencv-python-headless requests pyyaml sounddevice tzdata
      - name: Run the tests
        run: python -m unittest discover -s tests -t .

  website:
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_guide.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Work out the release tag (from core/version.py)
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "from core.version import __version__ as v; print(v)")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; fi
          echo "name=v$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists: nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the program zip
        if: steps.tag.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $items = Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','.github','dist','build','tests','data','logs','recordings','.venv','__pycache__','launcher') }
          Compress-Archive -Path $items.FullName -DestinationPath dist/Starling-app.zip
          $hash = (Get-FileHash dist/Starling-app.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Starling-app.zip" | Out-File -Encoding ascii -NoNewline dist/Starling-app.zip.sha256

      - name: Build Starling.exe
        if: steps.tag.outputs.skip != 'true'
        shell: pwsh
        run: |
          "REPO = `"${{ github.repository }}`"" | Out-File -Encoding ascii launcher/launcher_config.py
          pip install pyinstaller certifi
          pyinstaller --noconfirm --onefile --windowed --name Starling --icon ui/assets/starling.ico --add-data "ui/assets/starling.ico;ui/assets" --paths . --paths launcher launcher/launcher.py

      - name: Publish the release
        if: steps.tag.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          files="dist/Starling.exe dist/Starling-app.zip dist/Starling-app.zip.sha256"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber     # you already made the release by hand: add the files
          else
            gh release create "$tag" $files --target "${GITHUB_SHA}" --title "Starling $tag" --generate-notes
          fi
